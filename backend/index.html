    <script type="module" async blocking="render">
        const DARK_MODE_CLASS = "pf-v5-theme-dark";
          const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

          updateDarkMode(mediaQuery.matches);
          mediaQuery.addEventListener("change", (event) => updateDarkMode(event.matches));

          function updateDarkMode(isEnabled) {
            const { classList } = document.documentElement;

            if (isEnabled) {
              classList.add(DARK_MODE_CLASS);
            } else {
              classList.remove(DARK_MODE_CLASS);
            }
          }
    </script>
    <script type="module" src="/resources/zom1k/login/keycloak.v2/js/passwordVisibility.js"></script>
    <script type="module">
        import { startSessionPolling } from "/resources/zom1k/login/keycloak.v2/js/authChecker.js";

        startSessionPolling(
            "/realms/agriculture/login-actions/restart?client_id=gateway-client&tab_id=2GiEdF0hIZ8&client_data=eyJydSI6Imh0dHA6Ly9sb2NhbGhvc3Q6ODA4MS9sb2dpbi9vYXV0aDIvY29kZS9rZXljbG9hayIsInJ0IjoiY29kZSIsInN0IjoiZHZwT1A4cE1rbDNWdm9sZnFrOTU4NldNQmd2WEx3Zzl4WjVSQk96TG13Yz0ifQ&skip_logout=true"
        );
    </script>
    <script type="module">
        document.addEventListener("click", (event) => {
            const link = event.target.closest("a[data-once-link]");

            if (!link) {
                return;
            }

            if (link.getAttribute("aria-disabled") === "true") {
                event.preventDefault();
                return;
            }

            const { disabledClass } = link.dataset;

            if (disabledClass) {
                link.classList.add(...disabledClass.trim().split(/\s+/));
            }

            link.setAttribute("role", "link");
            link.setAttribute("aria-disabled", "true");
        });
    </script>
    <script type="module">
        import { checkAuthSession } from "/resources/zom1k/login/keycloak.v2/js/authChecker.js";

            checkAuthSession(
                "Z3KTgV+MpQ85ekSuU/v8wHOauonc6EI9hk1XBaoSwTc"
            );
    </script>
