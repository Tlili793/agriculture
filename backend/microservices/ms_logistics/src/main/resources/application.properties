spring.application.name=logistics-service
server.port=${PORT:8087}

#DataSource - H2 file database
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/logisticsdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

#H2 console (disabled by default)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

#Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=${EUREKA_INSTANCE_HOST:localhost}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:false}
eureka.instance.lease-renewal-interval-in-seconds=10

#Actuator
management.endpoints.web.exposure.include=health,info

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
