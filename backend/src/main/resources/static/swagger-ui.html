<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agriculture Ecosystem - Swagger UI</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.18.2/favicon-32x32.png" sizes="32x32" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
    }
    .top-bar-brand {
      background: #2e7d32;
      color: white;
      padding: 12px 24px;
      font-family: sans-serif;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-bar-brand span {
      font-size: 14px;
      font-weight: normal;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="top-bar-brand">
    <div>&#127807; Agriculture Microservices Ecosystem</div>
    <span>Unified API Documentation</span>
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        urls: [
          { name: "Refrigerator Service", url: "/services/refrigerator/v3/api-docs" },
          { name: "Ordering Service",     url: "/services/ordering/v3/api-docs" },
          { name: "Reclamation Service",  url: "/services/reclamation/v3/api-docs" },
          { name: "Logistics Service",    url: "/services/logistics/v3/api-docs" },
          { name: "Marketplace Service",  url: "/services/marketplace/v3/api-docs" }
        ],
        "urls.primaryName": "Refrigerator Service",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
