server:
  port: 8083

spring:
  application:
    name: refrigerator-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/refrigerator}
    username: ${SPRING_DATASOURCE_USERNAME:refrigerator}
    password: ${SPRING_DATASOURCE_PASSWORD:refrigerator}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    hostname: ${EUREKA_INSTANCE_HOST:localhost}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 10
